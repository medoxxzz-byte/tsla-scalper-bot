<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>📓 سجل الصفقات — TSLA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 30px;
  }

  /* ─── Header ─── */
  .header {
    background: linear-gradient(135deg, #0d1b2a, #1a2a3a);
    padding: 14px 16px;
    border-bottom: 1px solid #1e3a5f;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 17px; color: #64b5f6; }
  .header a {
    color: #90caf9; font-size: 13px; text-decoration: none;
    background: #1e3a5f; padding: 5px 10px; border-radius: 6px;
  }

  /* ─── Stats Bar ─── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px 12px 0;
  }
  .stat-card {
    background: #111827;
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-card .val { font-size: 18px; font-weight: 700; }
  .stat-card .lbl { font-size: 10px; color: #6b7280; margin-top: 2px; }
  .green { color: #4caf50; }
  .red   { color: #f44336; }
  .blue  { color: #64b5f6; }
  .gold  { color: #ffd700; }

  /* ─── Add Entry Button ─── */
  .add-btn-wrap { padding: 12px 12px 0; }
  .add-btn {
    width: 100%;
    background: linear-gradient(135deg, #1565c0, #0d47a1);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .add-btn:active { opacity: 0.85; }

  /* ─── Modal ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    overflow-y: auto;
    padding: 20px 12px;
  }
  .modal-overlay.active { display: block; }
  .modal {
    background: #111827;
    border: 1px solid #1e3a5f;
    border-radius: 16px;
    padding: 20px 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .modal h2 { font-size: 16px; color: #64b5f6; margin-bottom: 16px; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 5px; }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: #0d1117;
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    color: #e0e0e0;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .form-group textarea { height: 70px; resize: none; }
  .form-group select option { background: #0d1117; }

  /* Direction buttons */
  .dir-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dir-btn {
    padding: 12px;
    border: 2px solid #1e3a5f;
    border-radius: 10px;
    background: #0d1117;
    color: #9ca3af;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .dir-btn.selected-call { border-color: #4caf50; color: #4caf50; background: #0a1f0a; }
  .dir-btn.selected-put  { border-color: #f44336; color: #f44336; background: #1f0a0a; }

  /* Image upload */
  .img-upload-area {
    border: 2px dashed #1e3a5f;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    color: #6b7280;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  .img-upload-area:hover { border-color: #64b5f6; }
  .img-upload-area input { display: none; }
  .img-preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .img-preview-grid img {
    width: 100%; aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #1e3a5f;
  }

  /* Modal buttons */
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .btn-save {
    background: #1565c0; color: #fff;
    border: none; border-radius: 10px;
    padding: 13px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .btn-cancel {
    background: #1f2937; color: #9ca3af;
    border: 1px solid #374151; border-radius: 10px;
    padding: 13px; font-size: 14px;
    cursor: pointer;
  }

  /* ─── Entries List ─── */
  .entries-wrap { padding: 12px; }
  .section-title {
    font-size: 13px; color: #6b7280;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1e3a5f;
  }

  .entry-card {
    background: #111827;
    border: 1px solid #1e3a5f;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .entry-card:hover { border-color: #2563eb; }
  .entry-card.open-card  { border-right: 3px solid #ffd700; }
  .entry-card.win-card   { border-right: 3px solid #4caf50; }
  .entry-card.loss-card  { border-right: 3px solid #f44336; }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .entry-dir {
    font-size: 13px; font-weight: 700;
    padding: 3px 10px; border-radius: 6px;
  }
  .call-badge { background: #0a1f0a; color: #4caf50; border: 1px solid #4caf50; }
  .put-badge  { background: #1f0a0a; color: #f44336; border: 1px solid #f44336; }

  .entry-pnl { font-size: 16px; font-weight: 700; }
  .entry-time { font-size: 11px; color: #6b7280; }

  .entry-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 6px;
  }
  .entry-field { font-size: 12px; color: #9ca3af; }
  .entry-field span { color: #e0e0e0; }

  .entry-notes {
    margin-top: 8px;
    font-size: 12px;
    color: #9ca3af;
    background: #0d1117;
    border-radius: 6px;
    padding: 7px 10px;
    line-height: 1.5;
  }

  .entry-images {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-top: 8px;
  }
  .entry-images img {
    width: 100%; aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #1e3a5f;
    cursor: pointer;
  }

  /* open badge */
  .open-badge {
    font-size: 10px; color: #ffd700;
    background: #1a1500; border: 1px solid #ffd700;
    border-radius: 4px; padding: 2px 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ─── Image Lightbox ─── */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    border-radius: 8px;
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    color: #fff; font-size: 28px; cursor: pointer;
    background: rgba(0,0,0,0.5); border-radius: 50%;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ─── Empty State ─── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #4b5563;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; }

  /* ─── Loading ─── */
  .loading { text-align: center; padding: 30px; color: #4b5563; font-size: 14px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>📓 سجل الصفقات</h1>
  <a href="/manual">← الخط 2</a>
</div>

<!-- Stats Bar -->
<div class="stats-bar">
  <div class="stat-card">
    <div class="val blue" id="statTotal">—</div>
    <div class="lbl">إجمالي</div>
  </div>
  <div class="stat-card">
    <div class="val gold" id="statWinRate">—</div>
    <div class="lbl">نسبة الفوز</div>
  </div>
  <div class="stat-card">
    <div class="val green" id="statWins">—</div>
    <div class="lbl">رابح</div>
  </div>
  <div class="stat-card">
    <div class="val" id="statPnl">—</div>
    <div class="lbl">صافي P&L</div>
  </div>
</div>

<!-- Add Entry Button -->
<div class="add-btn-wrap">
  <button class="add-btn" onclick="openModal()">+ تسجيل صفقة جديدة</button>
</div>

<!-- Entries List -->
<div class="entries-wrap">
  <div class="section-title">آخر الصفقات</div>
  <div id="entriesList"><div class="loading">جاري التحميل...</div></div>
</div>

<!-- ─── Add Entry Modal ─── -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>📝 تسجيل صفقة جديدة</h2>

    <!-- Direction -->
    <div class="form-group">
      <label>الاتجاه</label>
      <div class="dir-btns">
        <div class="dir-btn" id="btnCall" onclick="selectDir('CALL')">📈 CALL</div>
        <div class="dir-btn" id="btnPut"  onclick="selectDir('PUT')">📉 PUT</div>
      </div>
    </div>

    <!-- Entry Price -->
    <div class="form-group">
      <label>سعر الدخول (Mid Price)</label>
      <input type="number" id="fEntryPrice" placeholder="مثال: 7.53" step="0.01">
    </div>

    <!-- TSLA Price -->
    <div class="form-group">
      <label>سعر TSLA عند الدخول</label>
      <input type="number" id="fTslaPrice" placeholder="مثال: 409.50" step="0.01">
    </div>

    <!-- GEX Position -->
    <div class="form-group">
      <label>GEX — موقع السعر</label>
      <select id="fGex">
        <option value="">— اختر —</option>
        <option value="above_gamma_flip">✅ فوق Gamma Flip (آمن)</option>
        <option value="below_gamma_flip">⚠️ تحت Gamma Flip (خطر)</option>
        <option value="near_call_wall">🚧 قريب Call Wall (سقف)</option>
        <option value="near_put_wall">🛡️ قريب Put Wall (دعم)</option>
        <option value="unknown">غير معروف</option>
      </select>
    </div>

    <!-- CheddarFlow -->
    <div class="form-group">
      <label>CheddarFlow (نسبة CALL%)</label>
      <input type="number" id="fCheddar" placeholder="مثال: 72 (يعني 72% CALL)" min="0" max="100">
    </div>

    <!-- Notes -->
    <div class="form-group">
      <label>ملاحظات سبب الدخول</label>
      <textarea id="fNotes" placeholder="مثال: ترند صاعد قوي، فوق VWAP، ADX=28، بعد بولباك..."></textarea>
    </div>

    <!-- Image Upload -->
    <div class="form-group">
      <label>صور (شارت / CheddarFlow / GEX)</label>
      <div class="img-upload-area" onclick="document.getElementById('imgInput').click()">
        <input type="file" id="imgInput" accept="image/*" multiple onchange="previewImages(event)">
        📸 اضغط لرفع صورة أو أكثر
      </div>
      <div class="img-preview-grid" id="imgPreviewGrid"></div>
    </div>

    <div class="modal-btns">
      <button class="btn-save" onclick="saveEntry()">💾 حفظ الصفقة</button>
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- ─── Image Lightbox ─── -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-close">✕</div>
  <img id="lightboxImg" src="">
</div>

<script>
// ── State ──
let selectedDir = '';
let previewFiles = [];

// ── Load entries on start ──
window.addEventListener('load', loadEntries);

async function loadEntries() {
  try {
    const res = await fetch('/journal/entries?limit=50');
    const data = await res.json();
    renderStats(data.stats || {});
    renderEntries(data.entries || []);
  } catch(e) {
    document.getElementById('entriesList').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>خطأ في التحميل</p></div>';
  }
}

function renderStats(s) {
  document.getElementById('statTotal').textContent   = s.total ?? '0';
  document.getElementById('statWinRate').textContent = s.win_rate != null ? s.win_rate + '%' : '0%';
  document.getElementById('statWins').textContent    = (s.wins ?? 0) + '/' + (s.closed ?? 0);
  const pnl = s.total_pnl ?? 0;
  const el = document.getElementById('statPnl');
  el.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
  el.className = 'val ' + (pnl >= 0 ? 'green' : 'red');
}

function renderEntries(entries) {
  const wrap = document.getElementById('entriesList');
  if (!entries.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>لا توجد صفقات مسجلة بعد</p></div>';
    return;
  }
  wrap.innerHTML = entries.map(e => entryHTML(e)).join('');
}

function entryHTML(e) {
  const isOpen  = e.status === 'open';
  const pnl     = e.pnl_dollar;
  const isWin   = pnl != null && pnl > 0;
  const isLoss  = pnl != null && pnl <= 0;
  const cardCls = isOpen ? 'open-card' : (isWin ? 'win-card' : 'loss-card');
  const dirBadge = e.direction === 'CALL'
    ? '<span class="entry-dir call-badge">📈 CALL</span>'
    : '<span class="entry-dir put-badge">📉 PUT</span>';
  const pnlHtml = isOpen
    ? '<span class="open-badge">● مفتوحة</span>'
    : `<span class="entry-pnl ${isWin ? 'green' : 'red'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</span>`;

  const gexLabels = {
    'above_gamma_flip': '✅ فوق Gamma Flip',
    'below_gamma_flip': '⚠️ تحت Gamma Flip',
    'near_call_wall':   '🚧 قريب Call Wall',
    'near_put_wall':    '🛡️ قريب Put Wall',
    'unknown':          '—',
    '': '—'
  };

  const imagesHtml = (e.images && e.images.length)
    ? `<div class="entry-images">${e.images.map(img =>
        `<img src="/journal/img/${img}" onclick="openLightbox('/journal/img/${img}', event)">`
      ).join('')}</div>`
    : '';

  const notesHtml = e.notes
    ? `<div class="entry-notes">💬 ${e.notes}</div>`
    : '';

  return `
  <div class="entry-card ${cardCls}">
    <div class="entry-header">
      ${dirBadge}
      ${pnlHtml}
    </div>
    <div class="entry-time">${e.created_at || ''}</div>
    <div class="entry-row">
      <div class="entry-field">دخول: <span>$${e.entry_price || '—'}</span></div>
      <div class="entry-field">TSLA: <span>$${e.tsla_price || '—'}</span></div>
      <div class="entry-field">GEX: <span>${gexLabels[e.gex_position] || '—'}</span></div>
      <div class="entry-field">CheddarFlow: <span>${e.cheddar_flow ? e.cheddar_flow + '% CALL' : '—'}</span></div>
      ${e.exit_price ? `<div class="entry-field">خروج: <span>$${e.exit_price}</span></div>` : ''}
      ${e.exit_reason ? `<div class="entry-field">سبب: <span>${exitLabel(e.exit_reason)}</span></div>` : ''}
    </div>
    ${notesHtml}
    ${imagesHtml}
  </div>`;
}

function exitLabel(r) {
  const m = { tp: '✅ TP', sl: '❌ SL', manual_stop: '🛑 يدوي', auto_tp: '✅ TP تلقائي', auto_sl: '❌ SL تلقائي' };
  return m[r] || r;
}

// ── Modal ──
function openModal() {
  // جلب سعر TSLA الحالي تلقائياً
  fetch('/manual/status').then(r => r.json()).then(d => {
    if (d.tsla_price) document.getElementById('fTslaPrice').value = d.tsla_price;
  }).catch(() => {});
  document.getElementById('addModal').classList.add('active');
}

function closeModal() {
  document.getElementById('addModal').classList.remove('active');
  resetForm();
}

function resetForm() {
  selectedDir = '';
  previewFiles = [];
  document.getElementById('btnCall').className = 'dir-btn';
  document.getElementById('btnPut').className  = 'dir-btn';
  document.getElementById('fEntryPrice').value = '';
  document.getElementById('fTslaPrice').value  = '';
  document.getElementById('fGex').value        = '';
  document.getElementById('fCheddar').value    = '';
  document.getElementById('fNotes').value      = '';
  document.getElementById('imgPreviewGrid').innerHTML = '';
  document.getElementById('imgInput').value    = '';
}

function selectDir(dir) {
  selectedDir = dir;
  document.getElementById('btnCall').className = 'dir-btn' + (dir === 'CALL' ? ' selected-call' : '');
  document.getElementById('btnPut').className  = 'dir-btn' + (dir === 'PUT'  ? ' selected-put'  : '');
}

function previewImages(event) {
  const files = Array.from(event.target.files);
  previewFiles = previewFiles.concat(files);
  const grid = document.getElementById('imgPreviewGrid');
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      grid.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

async function saveEntry() {
  if (!selectedDir) { alert('اختر CALL أو PUT أولاً'); return; }
  const entryPrice = parseFloat(document.getElementById('fEntryPrice').value);
  if (!entryPrice) { alert('أدخل سعر الدخول'); return; }

  const payload = {
    direction:    selectedDir,
    entry_price:  entryPrice,
    tsla_price:   parseFloat(document.getElementById('fTslaPrice').value) || 0,
    gex_position: document.getElementById('fGex').value,
    cheddar_flow: document.getElementById('fCheddar').value,
    notes:        document.getElementById('fNotes').value.trim(),
  };

  try {
    // 1. حفظ الصفقة
    const res  = await fetch('/journal/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) { alert('خطأ في الحفظ'); return; }
    const entryId = data.id;

    // 2. رفع الصور
    for (const file of previewFiles) {
      const fd = new FormData();
      fd.append('image', file);
      await fetch(`/journal/image/${entryId}`, { method: 'POST', body: fd });
    }

    closeModal();
    loadEntries();
  } catch(e) {
    alert('خطأ في الاتصال');
  }
}

// ── Lightbox ──
function openLightbox(src, event) {
  event.stopPropagation();
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
</script>
</body>
</html>
